# Local development environment: postgres + minio + rabbitmq + core + ai-enrichment + analytics
# + client (npm workspaces).
#   docker compose up            start everything (first run builds images)
#   docker compose down -v       stop and wipe database / files
# Optional overrides and secrets (GROQ_API_KEY) go to the root .env, see .env.example.

name: music-platform

x-rabbitmq-credentials: &rabbitmq-credentials
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-platform}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-platform-secret}

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}

services:
  postgres:
    # pgvector: vector similarity search for recommendations (later stage)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
      # database per service: created by infra/postgres/init on a new volume
      AI_ENRICHMENT_DB_PASSWORD: ${AI_ENRICHMENT_DB_PASSWORD:-ai-enrichment}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U music -d music']
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    # Official minio/minio images are no longer published on Docker Hub;
    # bitnamilegacy is the frozen Bitnami build of the same MinIO server.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      <<: *minio-credentials
      MINIO_SKIP_CLIENT: 'yes'
    ports:
      # S3 API, also serves public files to the browser.
      # This build has no web console; browse files with mc (see README).
      - '${MINIO_PORT:-9000}:9000'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    # one-shot: bucket, public-read policy, mock images (infra/minio/init.sh)
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    entrypoint: ['sh', '/init/init.sh']
    environment:
      <<: *minio-credentials
      MINIO_ENDPOINT: http://minio:9000
      S3_BUCKET: music-files
      SEED_DIR: /init/seed
    volumes:
      - ./infra/minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  rabbitmq:
    # management plugin: web UI and HTTP API on 15672
    image: rabbitmq:4-management
    environment:
      <<: *rabbitmq-credentials
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 30

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      API_DOCS_USER: ${API_DOCS_USER:-}
      API_DOCS_PASSWORD: ${API_DOCS_PASSWORD:-}
      # local development secrets; override in the root .env if needed
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-dev-encryption-key-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: music
      DB_USERNAME: music
      DB_PASSWORD: music
      DB_SSL: 'false'
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-secret}
      S3_BUCKET: music-files
      # URL used by the browser, so it points to the port published on the host
      PUBLIC_FILES_BASE_URL: http://localhost:${MINIO_PORT:-9000}/music-files
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-platform}:${RABBITMQ_PASSWORD:-platform-secret}@rabbitmq:5672
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    healthcheck:
      # GET /health: database + RabbitMQ (the image has no curl)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      # first start may run npm ci and compile before listening
      start_period: 180s
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./apps/core:/app/apps/core
      - ./packages:/app/packages
      # container-only: Linux build of native modules (argon2)
      - core-node-modules:/app/node_modules
      - core-app-node-modules:/app/apps/core/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  ai-enrichment:
    # song.uploaded → transcription (Groq Whisper) + lyrics analysis (Groq LLM)
    # → song.enriched; own database, consumes and publishes through RabbitMQ
    build:
      context: .
      dockerfile: apps/ai-enrichment/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_enrichment
      DB_USERNAME: ai_enrichment
      DB_PASSWORD: ${AI_ENRICHMENT_DB_PASSWORD:-ai-enrichment}
      DB_SSL: 'false'
      # read-only use: downloads uploaded audio by its object key
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-secret}
      S3_BUCKET: music-files
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-platform}:${RABBITMQ_PASSWORD:-platform-secret}@rabbitmq:5672
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-fake}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FAKE_TRANSCRIPTION_DELAY_MS: ${FAKE_TRANSCRIPTION_DELAY_MS:-1000}
      FAKE_LLM_DELAY_MS: ${FAKE_LLM_DELAY_MS:-500}
    ports:
      # only for opening /health from the host; other services use RabbitMQ
      - '${AI_ENRICHMENT_PORT:-3001}:3001'
    healthcheck:
      # GET /health: database + RabbitMQ (the image has no curl)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./apps/ai-enrichment:/app/apps/ai-enrichment
      - ./packages:/app/packages
      # container-only node_modules
      - ai-enrichment-node-modules:/app/node_modules
      - ai-enrichment-app-node-modules:/app/apps/ai-enrichment/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # in development Core builds and watches the shared packages
      core:
        condition: service_healthy

  analytics:
    # raw event log, listening sessions, implicit scores, preference profiles
    # → profile.updated; own database, only RabbitMQ in and out
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: analytics
      DB_USERNAME: analytics
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-analytics}
      DB_SSL: 'false'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-platform}:${RABBITMQ_PASSWORD:-platform-secret}@rabbitmq:5672
      PROFILE_RECOMPUTE_INTERVAL_MS: ${PROFILE_RECOMPUTE_INTERVAL_MS:-60000}
    ports:
      # /health and the debug view GET /profiles/:userId from the host
      - '${ANALYTICS_PORT:-3002}:3002'
    healthcheck:
      # GET /health: database + RabbitMQ (the image has no curl)
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./apps/analytics:/app/apps/analytics
      - ./packages:/app/packages
      # container-only node_modules
      - analytics-node-modules:/app/node_modules
      - analytics-app-node-modules:/app/apps/analytics/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # in development Core builds and watches the shared packages
      core:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-3000}
    ports:
      # host 5000 is taken by AirPlay Receiver on macOS
      - '${CLIENT_PORT:-5173}:5000'
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./apps/client:/app/apps/client
      - client-node-modules:/app/node_modules
      - client-app-node-modules:/app/apps/client/node_modules
    depends_on:
      - core

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  core-node-modules:
  core-app-node-modules:
  client-node-modules:
  client-app-node-modules:
  ai-enrichment-node-modules:
  ai-enrichment-app-node-modules:
  analytics-node-modules:
  analytics-app-node-modules:
